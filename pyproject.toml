[project]
name = "tochka-sdk"
version = "0.1.0"
description = "Async SDK for the Tochka Bank Open API (uapi, cyclops, pay-gateway, medusa)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
webhooks = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tochka"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 hunt Cyrillic homoglyphs in otherwise-Latin text. Every docstring here is
# quoted from the bank's Russian spec, so the rule fires on correct text, all 800+ times.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Generated files only. A qualified enum default
# (`x: CreateVirtualAccountV2ParamsVirtualAccountType = CreateVirtualAccountV2ParamsVirtualAccountType.STANDARD`)
# is ONE token pair the formatter cannot split — the line is unfixable by construction, and
# shortening it would mean inventing names the spec does not use. Hand-written code keeps E501.
"tochka/methods/*.py" = ["E501"]
"tochka/models/*.py" = ["E501"]
"tochka/facade/*.py" = ["E501"]
"tochka/enums/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
